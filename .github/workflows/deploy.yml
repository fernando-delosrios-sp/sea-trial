name: Deploy

on:
  workflow_dispatch:

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required GitHub configuration
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          AGENT_SERVICE_URL: ${{ vars.AGENT_SERVICE_URL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          SLACK_TEAM_ID: ${{ vars.SLACK_TEAM_ID }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_LOGS_ENABLED: ${{ vars.OTEL_LOGS_ENABLED }}
        run: |
          set -euo pipefail
          missing=0

          check_secret() {
            if [ -z "${!1:-}" ]; then
              echo "Missing secret: $1"
              missing=1
            fi
          }

          check_var() {
            if [ -z "${!1:-}" ]; then
              echo "Missing variable: $1"
              missing=1
            fi
          }

          check_secret LLM_API_KEY
          check_secret SLACK_SERVICE_TOKEN
          check_secret RENDER_API_KEY
          check_var AGENT_SERVICE_URL
          check_var LLM_BASE_URL
          check_var LLM_MODEL
          check_var RENDER_SERVICE_ID
          check_var SLACK_TEAM_ID

          if [ "${OTEL_LOGS_ENABLED:-false}" = "true" ]; then
            check_secret OTEL_EXPORTER_OTLP_HEADERS
            check_var OTEL_EXPORTER_OTLP_ENDPOINT
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

  deploy-agent-service:
    needs: validate-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify agent-service build
        run: npm ci && npm run build

      - name: Sync Render environment variables
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_LOGS_ENABLED: ${{ vars.OTEL_LOGS_ENABLED }}
          OTEL_SERVICE_NAME: sea-trial-agent-service
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg apiKey "$LLM_API_KEY" \
            --arg baseUrl "$LLM_BASE_URL" \
            --arg model "$LLM_MODEL" \
            --arg otlpEndpoint "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" \
            --arg otlpHeaders "${OTEL_EXPORTER_OTLP_HEADERS:-}" \
            --arg otlpEnabled "${OTEL_LOGS_ENABLED:-false}" \
            --arg otlpServiceName "${OTEL_SERVICE_NAME:-sea-trial-agent-service}" \
            '[
              {"key":"LLM_API_KEY","value":$apiKey},
              {"key":"LLM_BASE_URL","value":$baseUrl},
              {"key":"LLM_MODEL","value":$model},
              {"key":"OTEL_EXPORTER_OTLP_ENDPOINT","value":$otlpEndpoint},
              {"key":"OTEL_EXPORTER_OTLP_HEADERS","value":$otlpHeaders},
              {"key":"OTEL_LOGS_ENABLED","value":$otlpEnabled},
              {"key":"OTEL_SERVICE_NAME","value":$otlpServiceName}
            ]')"
          curl -fsS -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: Trigger Render deploy and wait for completion
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          before_id="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=1" \
            | jq -r '.[0].deploy.id // empty')"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -d '{}'
          for _ in $(seq 1 60); do
            deploy_json="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=1")"
            id="$(echo "$deploy_json" | jq -r '.[0].deploy.id')"
            status="$(echo "$deploy_json" | jq -r '.[0].deploy.status')"
            if [ -n "$id" ] && { [ -z "$before_id" ] || [ "$id" != "$before_id" ]; }; then
              case "$status" in
                live)
                  echo "Render deploy live: $id"
                  exit 0
                  ;;
                build_failed|update_failed|canceled|deactivated)
                  echo "Render deploy failed ($status): $id"
                  exit 1
                  ;;
              esac
            fi
            echo "Waiting for Render deploy (status=${status:-unknown})..."
            sleep 10
          done
          echo "Timed out waiting for Render deploy to complete"
          exit 1

      - name: Wait for agent-service health check
        env:
          AGENT_SERVICE_URL: ${{ vars.AGENT_SERVICE_URL }}
        run: |
          set -euo pipefail
          health_url="${AGENT_SERVICE_URL%/}/health"
          curl -fsS "$health_url"
          echo "Health check passed: $health_url"

  deploy-slack-app:
    needs: deploy-agent-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build workspace packages for slack-app
        run: npm ci && npm run build -w @sea-trial/shared && npm run build -w @sea-trial/observability

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Slack CLI
        run: curl -fsSL https://downloads.slack-edge.com/slack-cli/install.sh | bash

      - name: Warm Deno cache for slack deploy
        working-directory: slack-app
        run: |
          set -euo pipefail
          deno task embed-content
          deno cache --config deno.jsonc manifest.ts
          for f in functions/*/mod.ts; do
            deno cache --config deno.jsonc "$f"
          done

      - name: Deploy slack-app
        working-directory: slack-app
        env:
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
          AGENT_SERVICE_URL: ${{ vars.AGENT_SERVICE_URL }}
          SLACK_TEAM_ID: ${{ vars.SLACK_TEAM_ID }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_LOGS_ENABLED: ${{ vars.OTEL_LOGS_ENABLED }}
          OTEL_SERVICE_NAME: sea-trial-slack-app
        run: |
          set -euo pipefail
          APP_ID="$(deno run -q --allow-read scripts/read-app-id.ts)"
          # .env supplies manifest build-time values (outgoingDomains)
          cat > .env <<EOF
          AGENT_SERVICE_URL=$AGENT_SERVICE_URL
          SLACK_TEAM_ID=$SLACK_TEAM_ID
          OTEL_LOGS_ENABLED=${OTEL_LOGS_ENABLED:-false}
          OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
          OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
          OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-sea-trial-slack-app}
          SLACK_BOT_TOKEN=
          SLACK_APP_TOKEN=
          EOF
          slack env set AGENT_SERVICE_URL "$AGENT_SERVICE_URL" --app "$APP_ID" --token "$SLACK_SERVICE_TOKEN" -s
          slack env set SLACK_TEAM_ID "$SLACK_TEAM_ID" --app "$APP_ID" --token "$SLACK_SERVICE_TOKEN" -s
          slack env set OTEL_LOGS_ENABLED "${OTEL_LOGS_ENABLED:-false}" --app "$APP_ID" --token "$SLACK_SERVICE_TOKEN" -s
          slack env set OTEL_EXPORTER_OTLP_ENDPOINT "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" --app "$APP_ID" --token "$SLACK_SERVICE_TOKEN" -s
          slack env set OTEL_EXPORTER_OTLP_HEADERS "${OTEL_EXPORTER_OTLP_HEADERS:-}" --app "$APP_ID" --token "$SLACK_SERVICE_TOKEN" -s
          slack env set OTEL_SERVICE_NAME "${OTEL_SERVICE_NAME:-sea-trial-slack-app}" --app "$APP_ID" --token "$SLACK_SERVICE_TOKEN" -s
          slack deploy -s --app "$APP_ID" --token "$SLACK_SERVICE_TOKEN"

      - name: Provision Slack triggers
        working-directory: slack-app
        env:
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
          SLACK_TRIGGER_CHANNEL_IDS: ${{ vars.SLACK_TRIGGER_CHANNEL_IDS }}
        run: ./scripts/provision-triggers.sh


