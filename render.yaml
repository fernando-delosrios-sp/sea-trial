services:
  - type: web
    name: tes-agent-service
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build -w @tes-event-process/agent-service
    startCommand: npm run start -w @tes-event-process/agent-service
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
