services:
  - type: web
    name: sea-trial-agent-service
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start -w @sea-trial/agent-service
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_LOGS_ENABLED
        sync: false
      - key: OTEL_SERVICE_NAME
        sync: false


